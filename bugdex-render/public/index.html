<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BugDex</title>
<style>
:root{--bg1:#e4f7ec;--bg2:#a9dccb;--ink:#12302a;--mute:#4d6b63;--card:rgba(255,255,255,.65);--line:rgba(0,0,0,.09);--acc:#14a56f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#16303a;--bg2:#0a141a;--ink:#e8f4ef;--mute:#8fb0a6;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.12);color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#16303a;--bg2:#0a141a;--ink:#e8f4ef;--mute:#8fb0a6;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.12);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:linear-gradient(var(--bg1),var(--bg2)) fixed;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:18px 16px 40px}
h1{margin:0;font-size:26px;letter-spacing:-.5px}h2{font-size:16px;margin:26px 0 10px}
header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
#prog{color:var(--mute);font-size:13px}
.stage{--g:#2ee6a6;position:relative;height:min(82vw,350px);display:grid;place-items:center;border-radius:30px;overflow:hidden;background:radial-gradient(circle at 50% 58%,color-mix(in srgb,var(--g) 50%,transparent),transparent 68%),var(--card);border:1px solid var(--line);perspective:700px}
.ring{position:absolute;width:72%;aspect-ratio:1;border-radius:50%;border:2px solid color-mix(in srgb,var(--g) 70%,transparent);box-shadow:0 0 0 16px color-mix(in srgb,var(--g) 16%,transparent),0 0 0 34px color-mix(in srgb,var(--g) 8%,transparent),inset 0 0 40px color-mix(in srgb,var(--g) 35%,transparent)}
.tilt{position:relative;width:68%;max-width:270px;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s}
.pop{animation:pop .7s cubic-bezier(.2,1.4,.4,1)}
.tilt svg{width:100%;display:block;overflow:visible;filter:drop-shadow(0 12px 10px rgba(0,0,0,.35));animation:float 3.2s ease-in-out infinite}
.shiny svg{animation:float 3.2s ease-in-out infinite,hue 5s linear infinite}
.glare{animation:sweep 2.6s ease-in-out infinite}
.sp{position:absolute;left:var(--x);top:var(--y);color:#fff;font-size:var(--s);text-shadow:0 0 8px #fff,0 0 16px var(--g);animation:tw 1.6s ease-in-out var(--d) infinite;font-style:normal}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.flash.go{animation:fl .6s}
.banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);padding:4px 12px;border-radius:99px;font-size:12px;font-weight:700;background:linear-gradient(90deg,#ff4fd8,#ffd45c,#37e6ff);color:#111;white-space:nowrap}
.scanbox{position:relative;width:54%;aspect-ratio:1;border-radius:22px;overflow:hidden;background:#0007 center/cover;box-shadow:0 0 0 3px var(--acc)}
.scanbox:after{content:"";position:absolute;left:0;right:0;height:30%;background:linear-gradient(transparent,rgba(46,230,166,.7),transparent);animation:scan 1.1s linear infinite}
.scantxt{position:absolute;bottom:14px;font-size:13px;color:var(--mute)}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes hue{0%,100%{filter:drop-shadow(0 12px 10px rgba(0,0,0,.35)) drop-shadow(0 0 14px var(--g)) hue-rotate(0)}50%{filter:drop-shadow(0 12px 10px rgba(0,0,0,.35)) drop-shadow(0 0 22px var(--g)) hue-rotate(45deg) saturate(1.5)}}
@keyframes sweep{0%{transform:translateX(-120px)}60%,100%{transform:translateX(270px)}}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
@keyframes pop{0%{transform:scale(.2) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}
@keyframes scan{0%{top:-30%}100%{top:100%}}
#info{margin-top:14px;padding:14px 16px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nm{font-size:20px;font-weight:700}.sci{font-size:13px;font-style:italic;color:var(--mute);margin:2px 0 8px}
.cp{font-size:13px;color:var(--mute)}.cp b{font-size:24px;color:var(--ink)}
.chip{display:inline-block;padding:2px 9px;margin-right:6px;border-radius:99px;font-size:12px;border:1px solid var(--line)}
.bar{display:grid;grid-template-columns:84px 1fr;align-items:center;font-size:12px;color:var(--mute);margin-top:6px}
.bar i{display:block;height:7px;border-radius:9px;background:var(--line)}.bar i b{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--acc),var(--g))}
.actions{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;text-align:center;padding:13px;border-radius:16px;font:600 15px system-ui,sans-serif;background:var(--acc);color:#fff;border:0;cursor:pointer;box-shadow:0 6px 16px rgba(20,165,111,.35)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
small{display:block;margin-top:10px;color:var(--mute);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.card{--g:#fff;padding:8px 6px 10px;border-radius:18px;border:1px solid var(--line);background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--g) 38%,transparent),transparent 70%),var(--card);color:var(--ink);cursor:pointer;font:inherit;text-align:center}
.card svg{width:78%;filter:drop-shadow(0 5px 4px rgba(0,0,0,.3))}.card b{display:block;font-size:12px}.card span{font-size:11px;color:var(--mute)}
.empty{color:var(--mute);font-size:13px}#bt{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px calc(env(safe-area-inset-bottom,0px) + 10px);background:linear-gradient(var(--bg1),var(--bg2));color:var(--ink)}#bt.on{display:flex}
#cv{width:100%;display:block;border-radius:22px;touch-action:none;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#sw{display:flex;gap:10px;width:100%}.swb{flex:1;padding:6px;border-radius:16px;border:2px solid var(--line);background:var(--card);cursor:pointer}.swb svg{width:100%;display:block}.swb i{display:block;height:6px;border-radius:9px;background:var(--line);overflow:hidden}.swb i b{display:block;height:100%;background:#3ddc84}.swb.on{border-color:var(--acc);box-shadow:0 0 14px var(--acc)}.swb.dead{opacity:.3;pointer-events:none}
#res{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,.6);border-radius:22px;color:#fff;font-size:30px}.card.sel{outline:3px solid var(--acc)}
#ab{display:flex;gap:12px;width:100%}#ab button{position:relative;flex:1;overflow:hidden;padding:16px 8px;border-radius:18px;border:0;color:#fff;font:700 15px system-ui,sans-serif;cursor:pointer;touch-action:manipulation}#bn{background:#e0481c}#bs{background:#7a3df0}#ab i{display:block;height:6px;border-radius:9px;background:rgba(255,255,255,.3);margin-top:6px;overflow:hidden}#ab i b{display:block;height:100%;background:#fff}#bs:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.55);transform-origin:bottom;transform:scaleY(var(--c,0))}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.fr{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:14px}.fr span{flex:1}.fr button,#soc input,#mq{padding:7px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}#soc input,#mq{flex:1;min-width:0;cursor:text}.tabs button{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 12px system-ui,sans-serif;cursor:pointer}.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.ph{position:absolute;left:12px;bottom:12px;width:54px;height:54px;object-fit:cover;border-radius:14px;border:2px solid #fff}
</style></head><body><main>
<header><h1>BugDex</h1><span id="prog"></span></header>
<section class="stage" id="stage"></section>
<section id="info"></section>
<div class="actions"><label class="btn">Scan a bug<input type="file" accept="image/*" capture="environment" id="file" hidden></label><button class="btn ghost" id="demo">Quick demo scan</button><button class="btn" id="btgo" style="background:#e0481c">Battle</button></div>
<small>Demo mode: species are picked at random for now. Real photo identification comes next.</small>
<div id="bt"><div id="pk" style="display:none;width:100%;max-width:520px"><h2>Choose a fight, then pick up to 3</h2><div class="tabs" id="ptabs"><button data-t="bug" class="on">Bugs fight</button><button data-t="small">Small animals fight</button><button data-t="large">Large animals fight</button></div><div class="grid" id="pg"></div><h2 style="font-size:14px">Plant helper (optional)</h2><div class="grid" id="pp"></div><div class="actions"><button class="btn" id="fight">Fight</button><button class="btn ghost" id="bk0">Close</button></div><small id="pn">0 / 3 picked</small></div><div id="bf" style="display:none;flex-direction:column;align-items:center;width:100%;max-width:420px;gap:10px;position:relative"><canvas id="cv"></canvas><div id="ab"><button id="bn">Attack<i><b id="amb"></b></i></button><button id="bs"><span id="bsl">Special</span></button></div><div id="sw"></div><small id="plt"></small><div id="res"><b id="rt"></b><div class="actions"><button class="btn" id="rm">Rematch</button><button class="btn ghost" id="bk">Back</button></div></div></div></div>
<h2>Market</h2><div class="fr"><input id="mq" placeholder="Search any bug or animal, e.g. tiger beetle" maxlength="60"><button id="mb">Search</button></div><div id="mres"></div><h2>Friends</h2><div id="soc"><small>Connecting…</small></div><h2>Your collection</h2><div class="tabs" id="tabs"><button data-t="all" class="on">All</button><button data-t="bug">Bugs</button><button data-t="small">Small animals</button><button data-t="large">Large animals</button><button data-t="plant">Plants</button></div><div class="grid" id="grid"></div>
<script>
/* Stand-in for claude.ai's built-in features, so identification and the market call YOUR server (/api/sample).
   Accounts, friends and live matches need claude.ai, so they are switched off here. */
if(!window.claude){window.claude={use:async n=>{if(n!=='sample')return null;
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(b)});
return{json:async(input,o={})=>{const images=await Promise.all([].concat(o.images||[]).map(b64));
const res=await fetch('/api/sample',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({input,images})});
if(!res.ok){const e=new Error((await res.json().catch(()=>({}))).error||'server error');e.code=res.status;throw e}
return res.json()}}}}}
</script>
<script>

<ellipse cx="100" cy="100" rx="7" ry="38" fill="#1b1209"/><ellipse cx="98" cy="86" rx="2" ry="14" fill="#fff" opacity=".3"/>
<circle cx="100" cy="58" r="9" fill="#1b1209"/><path d="M96 52C90 36 84 30 78 28M104 52C110 36 116 30 122 28" stroke="#1b1209" stroke-width="2.5" fill="none" stroke-linecap="round"/>${gl(u,s)}</svg>`}

<ellipse cx="100" cy="190" rx="36" ry="6" fill="#000" opacity=".25" filter="url(#${u}f)"/>${w}${M(w)}

<ellipse cx="95" cy="68" rx="3" ry="10" fill="#fff" opacity=".4"/>${gl(u,s)}</svg>`}
const S=[
{id:'lady',n:'Ladybug',sci:'Coccinella septempunctata',t:'Beetle',r:'Common',cp:120,hp:40,at:35,sp:45,g:'#ff6b5b',spots:1,k:beetle,c:{hi:'#ff9a88',mid:'#e0201c',lo:'#6e0a0a'}},
{id:'jewel',n:'Jewel Beetle',sci:'Chrysochroa fulgidissima',t:'Beetle',r:'Rare',cp:540,hp:60,at:55,sp:50,g:'#2ee6a6',stripe:1,k:beetle,c:{hi:'#c4ffd8',mid:'#12b878',lo:'#04503a'}},
{id:'rhino',n:'Rhinoceros Beetle',sci:'Trypoxylus dichotomus',t:'Beetle',r:'Epic',cp:780,hp:85,at:90,sp:30,g:'#d08a4b',horn:1,k:beetle,c:{hi:'#b98258',mid:'#5b3520',lo:'#1c0e06'}},
{id:'monarch',n:'Monarch Butterfly',sci:'Danaus plexippus',t:'Butterfly',r:'Uncommon',cp:310,hp:45,at:40,sp:70,g:'#ffa63d',k:butterfly,c:{hi:'#ffc069',mid:'#f26a0f',lo:'#a03000'}},
{id:'dragon',n:'Emperor Dragonfly',sci:'Anax imperator',t:'Dragonfly',r:'Rare',cp:460,hp:50,at:65,sp:95,g:'#4cc9f0',k:dragonfly,c:{hi:'#c4f4ff',mid:'#2aa7e0',lo:'#0a3d7a'}},
{id:'fox',cat:'small',n:'Red Fox',sci:'Vulpes vulpes',t:'Canine',r:'Uncommon',cp:400,hp:45,at:52,sp:70,g:'#ff8a3d',k:quadruped,c:{hi:'#f4a868',mid:'#c8561a',lo:'#5a230a'}},
{id:'hawk',cat:'small',n:'Red-tailed Hawk',sci:'Buteo jamaicensis',t:'Bird',r:'Rare',cp:480,hp:34,at:62,sp:88,g:'#e7b25a',k:bird,c:{hi:'#e0b08a',mid:'#8a5a3a',lo:'#3a2416'}},
{id:'coon',cat:'small',n:'Raccoon',sci:'Procyon lotor',t:'Mammal',r:'Common',cp:300,hp:42,at:40,sp:40,g:'#9a9ab0',k:quadruped,c:{hi:'#c4c4cc',mid:'#6c6c78',lo:'#25252c'}},
{id:'lion',cat:'large',n:'Lion',sci:'Panthera leo',t:'Big cat',r:'Epic',cp:900,hp:82,at:92,sp:72,g:'#ffc04d',k:quadruped,c:{hi:'#f6d896',mid:'#c9923f',lo:'#6b4416'}},

{id:'bear',cat:'large',n:'Brown Bear',sci:'Ursus arctos',t:'Mammal',r:'Rare',cp:950,hp:88,at:88,sp:46,g:'#c58a52',k:quadruped,c:{hi:'#b48660',mid:'#5a3a20',lo:'#1e1208'}},
{id:'clover',cat:'plant',n:'White Clover',sci:'Trifolium repens',t:'Plant',r:'Common',cp:120,hp:30,at:0,sp:0,g:'#5ccf6a',k:plant,fl:'#ffffff',role:'Feeder',rg:{Beetle:35,Butterfly:60,Dragonfly:5,Bee:95,Ant:25,Spider:5,Other:20},ab:{name:'Nectar Feast',desc:'Rich nectar and pollen that insects feed on.',type:'support'},c:{hi:'#9be58c',mid:'#2f9a46',lo:'#0f4a1f'}}];
